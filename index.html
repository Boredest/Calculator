<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Calculator</title>
  </head>
  <body>
    <header>
      <h1 class="title">Calculator</h1>
    </header>
    <main class="main">
      <div class="calculator">
        <section class="screen">0</section>
        <section class="clear-delete">
          <button>CLEAR</button>
          <button>DELETE</button>
        </section>
        <section class="buttons-container"></section>
      </div>
    </main>
    <footer class="footer">
      Copyright ©
      <script>
        document.write(new Date().getFullYear());
      </script>
      Boredest
      <a href="https://github.com/boredest">
        <img class="github-logo" src="github-logo.svg" alt="Github Logo" />
      </a>
    </footer>
  </body>
  <script src="app.js"></script>
</html>
